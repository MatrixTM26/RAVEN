# ── COMMON OVERRIDES ────────────────────────────────────────────
# server.host     = 0.0.0.0
# server.port     = 4444
# server.mode     = multi

# ── WEB PANEL ───────────────────────────────────────────────────
# web.host        = 0.0.0.0
# web.port        = 8080

# ── TEAM SERVER API ─────────────────────────────────────────────
# teamserver.port = 5001

# ── DATABASE ────────────────────────────────────────────────────
db.type         = sqlite
db.path         = database

# ── AGENT BEHAVIOUR ─────────────────────────────────────────────
agent.sleep.interval  = 5000
agent.jitter.ms       = 1000

# ── LOGGING ─────────────────────────────────────────────────────
logging.level         = INFO
logging.verbose       = false
logging.max.entries   = 1000
