# ═══════════════════════════════════════════════════════════════
#  RAVEN C2 — DEFAULT CONFIGURATION
#  All values here are the factory defaults embedded inside the JAR.
#  To override: create config/server/raven.properties
#  Any key you set there will shadow the corresponding default.
# ═══════════════════════════════════════════════════════════════

# ── AGENT LISTENER ──────────────────────────────────────────────
server.host                 = 0.0.0.0
server.port                 = 4444
server.mode                 = multi

# ── WEB / API ───────────────────────────────────────────────────
web.host                    = 0.0.0.0
web.port                    = 8080
web.template.dir            = config/interfaces/app/templates
web.static.dir              = config/interfaces/app/static
web.beacon.port             = -1

# ── TEAM SERVER ─────────────────────────────────────────────────
teamserver.port             = 5001
teamserver.api.prefix       = /api

# ── DATABASE ────────────────────────────────────────────────────
db.type                     = sqlite
db.path                     = database
db.url                      =
db.name                     = raven
db.user                     = raven
db.password                 = raven
db.mongo.uri                = mongodb://localhost:27017
db.mongo.name               = raven

# ── AGENT BEHAVIOUR ─────────────────────────────────────────────
agent.sleep.interval        = 5000
agent.jitter.ms             = 1000
agent.connection.timeout    = 10000
agent.command.timeout       = 120000
agent.max.connections       = 100
agent.buffer.size           = 8192

# ── CERTIFICATES ────────────────────────────────────────────────
cert.keystore.path          = certs/server.p12
cert.keystore.type          = PKCS12
cert.keystore.password      = raven

cert.truststore.path        = certs/truststore.p12
cert.truststore.type        = PKCS12
cert.truststore.password    = raven

cert.ca.path                = certs/ca.p12
cert.ca.type                = PKCS12
cert.ca.password            = raven

cert.agent.dir              = certs/agents
cert.tls.protocol           = TLSv1.3

cert.server.validity.days   = 365
cert.agent.validity.days    = 90
cert.ca.validity.days       = 3650

# ── CERT DISTINGUISHED NAMES (server) ───────────────────────────
cert.dn.cn                  = RAVEN Server
cert.dn.o                   = RAVEN C2 Frameworks
cert.dn.ou                  = ManInTheMatrix
cert.dn.l                   = DarkNet
cert.dn.st                  = Cybertron
cert.dn.c                   = US

# ── CERT DISTINGUISHED NAMES (CA) ───────────────────────────────
cert.ca.dn.cn               = RAVEN Root CA
cert.ca.dn.o                = RAVEN Frameworks V3
cert.ca.dn.ou               = ManInTheMatrix
cert.ca.dn.l                = DarkNet
cert.ca.dn.st               = Cybertron
cert.ca.dn.c                = US

# ── LOGGING ─────────────────────────────────────────────────────
logging.level               = INFO
logging.verbose             = false
logging.max.entries         = 1000
logging.file                = logs/raven.log
logging.file.enabled        = false

# ── INTERFACE ───────────────────────────────────────────────────
mode.interface              = cli

# ── EXPORTS ─────────────────────────────────────────────────────
export.dir                  = exports
